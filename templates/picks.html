{% extends "base.html" %}
{% block content %}
<section class="hero">
	<div class="eyebrow">Weekly matchup</div>
	<h2>Who are you picking?</h2>
	<p class="intro">Choose a team in every matchup, then submit your confidence points.</p>
</section>
<form method="post" action="{{ url_for('submit') }}" name="picks" onsubmit="return validateForm()">
	<div class="card">
		<div class="form-bar">
			<div class="field"><label for="name">Your name</label><input id="name" type="text" name="name" autocomplete="name" required placeholder="Enter your name"></div>
		</div>
		<div class="games">
			{% for team1, spread, team2 in picks %}
			<div class="game">
				<label class="team-option">
					<input type="radio" name="pick{{ loop.index }}" value="{{ team1 }}" required>
					<span class="team-name">{{ team1 }}</span><img src="{{ logos[team1] }}" alt="{{ team1 }} logo">
				</label>
				<div class="spread">Spread<strong>{{ spread }}</strong></div>
				<label class="team-option">
					<input type="radio" name="pick{{ loop.index }}" value="{{ team2 }}" required>
					<span class="team-name">{{ team2 }}</span><img src="{{ logos[team2] }}" alt="{{ team2 }} logo">
				</label>
			</div>
			{% endfor %}
		</div>
		<div class="submit-row">
			<div class="field"><label for="points">Confidence points</label><input id="points" type="number" name="points" min="0" required placeholder="10"></div>
			<span class="hint">All picks are required.</span>
			<button class="btn" type="submit">Submit picks</button>
		</div>
	</div>
</form>
<script>
	function validateForm() {
		const points = Number(document.forms.picks.points.value);
		if (!Number.isFinite(points) || points < 0) { alert("Confidence points must be a positive number."); return false; }
		return true;
	}
</script>
{% endblock %}
