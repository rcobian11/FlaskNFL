{% extends "base.html" %}
{% block title %}Generate Week | NFL Picks{% endblock %}
{% block content %}
<section class="hero"><div class="eyebrow">Commissioner tools</div><h2>Set up this week</h2><p class="intro">Generate the matchup board from the current NFL odds.</p></section>
<form method="post" action="{{ url_for('gen_submit') }}" class="card form-bar">
	<div class="field"><label for="games">Number of games</label><input id="games" type="number" name="games" min="1" required placeholder="16"></div>
	<div class="field"><label for="gif">Celebration GIF URL (optional)</label><input id="gif" type="url" name="gif" placeholder="https://..."></div>
	<button class="btn" type="submit">Generate matchups</button>
</form>
{% endblock %}
